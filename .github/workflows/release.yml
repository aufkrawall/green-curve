name: Release

# Manual stable release: build the full Windows + Linux matrix on one Linux
# runner, attest every artifact to the exact repo commit, then create a new
# stable tag (<VERSION>, matching the public repo's no-prefix convention) and
# GitHub Release for the artifacts.
#
# The toolchain is part of what is being attested here.  Every compiler, linker
# and archiver is fetched from this repository's own Compilers release, checked
# against a SHA-256 pinned in compilers/*/manifest.json, and the build then runs
# with GREENCURVE_TOOLCHAIN_LOCAL_ONLY so that reaching for anything else is a
# hard failure rather than a silent fallback to whatever the runner shipped.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Refuse any toolchain that did not come out of compilers/.
      GREENCURVE_TOOLCHAIN_LOCAL_ONLY: "1"
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable, and an
      # attestation is only worth what the workflow that produced it was.
      - name: Checkout the exact dispatch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify clean checkout
        run: |
          set -eu
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::checkout is not clean; refusing to release modified code"
            printf '%s\n' "$dirty"
            exit 1
          fi

      - name: Resolve version and tag from VERSION
        id: version
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::VERSION must be numeric MAJOR.MINOR[.PATCH], got '$version'"
            exit 1
          fi
          tag="${version}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if [ -n "$existing" ]; then
            echo "::error::tag '${tag}' already exists on origin"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.10'

      # No toolchain cache on the release path.  A restored cache is writable by
      # other workflow runs in a way a pinned archive is not, so the release
      # always unpacks the compilers from the archive whose SHA-256 this repo
      # commits to.  CI keeps its cache; CI does not publish anything.
      - name: Fetch the pinned toolchain from our own Compilers release
        run: python build.py --fetch-toolchain

      # Written into the workspace (and gitignored, like every other release
      # output) so it is attested and uploaded by the same globs as the
      # binaries rather than needing a path of its own.
      - name: Verify the toolchain and record what it is
        run: |
          python build.py --verify-toolchain \
            --toolchain-manifest "greencurve-${{ steps.version.outputs.version }}-toolchain.json"

      # 7-Zip is no longer installed from apt: it writes the Windows .7z
      # archives, so it is pinned and vendored with the compilers instead of
      # floating with whatever version the runner image happens to carry.
      - name: Build all targets (Windows + Linux, x64 + arm64)
        run: python build.py

      - name: Verify clean tree and all expected release artifacts
        run: |
          set -eu
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::build modified the tracked checkout"
            printf '%s\n' "$dirty"
            exit 1
          fi
          for f in \
            greencurve-${{ steps.version.outputs.version }}-windows-x64.7z \
            greencurve-${{ steps.version.outputs.version }}-windows-arm64.7z \
            greencurve-${{ steps.version.outputs.version }}-windows-x64-setup.exe \
            greencurve-${{ steps.version.outputs.version }}-windows-arm64-setup.exe \
            greencurve-${{ steps.version.outputs.version }}-linux-x64.tar.xz \
            greencurve-${{ steps.version.outputs.version }}-linux-arm64.tar.xz \
            greencurve-${{ steps.version.outputs.version }}-windows-x64.7z.sha256 \
            greencurve-${{ steps.version.outputs.version }}-windows-arm64.7z.sha256 \
            greencurve-${{ steps.version.outputs.version }}-windows-x64-setup.exe.sha256 \
            greencurve-${{ steps.version.outputs.version }}-windows-arm64-setup.exe.sha256 \
            greencurve-${{ steps.version.outputs.version }}-linux-x64.tar.xz.sha256 \
            greencurve-${{ steps.version.outputs.version }}-linux-arm64.tar.xz.sha256; do
            test -s "$f" || { echo "::error::missing or empty release artifact: $f"; exit 1; }
          done
          test -s "greencurve-${{ steps.version.outputs.version }}-toolchain.json" \
            || { echo "::error::toolchain manifest was not written"; exit 1; }

      # The toolchain record is attested alongside the binaries, so a consumer
      # can verify not only what was built but what built it.
      - name: Attest artifacts to the exact repo commit
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            greencurve-${{ steps.version.outputs.version }}-windows-*.7z
            greencurve-${{ steps.version.outputs.version }}-windows-*-setup.exe
            greencurve-${{ steps.version.outputs.version }}-linux-*.tar.xz
            greencurve-${{ steps.version.outputs.version }}-toolchain.json

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          awk -v version="$VERSION" '
            $0 == "## " version {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
            END {
              if (!found) {
                print "missing ## " version " section in CHANGELOG.md" > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || {
            echo "::error::release notes for ${VERSION} are empty"
            exit 1
          }

      - name: Create stable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Green Curve ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --target "${GITHUB_SHA}" \
            greencurve-${VERSION}-*

      - name: Verify attestations on released artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          for f in \
            greencurve-${VERSION}-windows-x64.7z \
            greencurve-${VERSION}-windows-arm64.7z \
            greencurve-${VERSION}-windows-x64-setup.exe \
            greencurve-${VERSION}-windows-arm64-setup.exe \
            greencurve-${VERSION}-linux-x64.tar.xz \
            greencurve-${VERSION}-linux-arm64.tar.xz \
            greencurve-${VERSION}-toolchain.json; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
          done
