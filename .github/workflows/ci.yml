name: CI

# Run the full Windows/Linux merge gates automatically for main and pull
# requests; expensive stable-release publication remains a separate manual
# workflow.
#
# Actions are pinned to commit SHAs rather than tags. Release toolchains come
# from this repository's Compilers release with SHA-256 pins in the manifests.
# The Windows MSVC-ABI build uses a separately pinned upstream LLVM download.
# CI caches these downloads and verifies them again before use.
permissions:
  contents: read
env:
  # Native crashes must not discard the phase markers that identify which
  # build-system self-test was running.
  PYTHONUNBUFFERED: "1"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Linux jobs name their runner image explicitly instead of using ubuntu-latest.
# The floating label moved to Ubuntu 26.04, for which actions/setup-python has no
# build of the pinned Python 3.12.10, so every Linux job failed in "Set up
# Python" without any change on our side.  The image is also what provides
# clang-tidy-18 (the documented ratchet version).  Moving to a newer image is a
# deliberate edit here and in release.yml / freshness.yml, verified against the
# pinned Python and analyzer versions first; tools/security_gates.py rejects the
# floating label.
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete history for secrets
        run: python3 tools/secret_scan.py

  windows:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.10'
      # The toolchains are ~190 MB of llvm-mingw plus Zig, redownloaded on every
      # job otherwise. build.py verifies every binary in the cached release
      # toolchains against the pinned digests. The separate upstream LLVM
      # archive is verified before extraction on every run.
      - name: Cache toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            llvm-mingw
            zig
            seven-zip
            build-tmp/ci-msvc-llvm/LLVM-22.1.8-win64.exe
          key: toolchain-windows-${{ hashFiles('build.py', 'compilers/*/manifest.json', '.github/workflows/ci.yml') }}
          restore-keys: toolchain-windows-
      - name: Provision LLVM for the Visual Studio 2026 STL
        shell: pwsh
        run: |
          $archive = 'build-tmp/ci-msvc-llvm/LLVM-22.1.8-win64.exe'
          if (-not (Test-Path -LiteralPath $archive)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
            curl.exe --fail --location --retry 3 --silent --show-error --output $archive `
              'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe'
            if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed' }
          }
          $expected = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "LLVM archive SHA-256 mismatch: $actual" }

          # Extract the upstream NSIS archive with full 7-Zip from the runner image.
          $root = Join-Path $env:RUNNER_TEMP 'greencurve-msvc-llvm'
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe'
          & $sevenZip x $archive "-o$root" -y 'bin\clang-cl.exe' 'bin\lld-link.exe' 'bin\llvm-pdbutil.exe' 'lib\clang' | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed' }
          "GREENCURVE_MSVC_LLVM_BIN=$(Join-Path $root 'bin')" >> $env:GITHUB_ENV
      - name: Verify the pinned toolchain
        run: python build.py --verify-toolchain
      # Keep these as separate steps: PowerShell otherwise returns only the
      # final native command's status and can hide a failed test behind a
      # successful check build. --test already enables UBSan by default.
      - name: Test with UndefinedBehaviorSanitizer
        run: python build.py --test
      - name: Check-build full target matrix
        run: python build.py --check --target all
      - name: Build with AddressSanitizer
        run: python build.py --test --asan
      - name: Static analysis ratchet
        run: python build.py --tidy
      - name: Fuzz untrusted-input boundaries
        run: python build.py --fuzz --fuzz-runs 5000
      - name: Build verified Windows release packages
        run: python build.py --target windows
      - name: Confirm both native Windows compiler variants
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          foreach ($arch in @("x64", "arm64")) {
            foreach ($variant in @("msvc", "release")) {
              $base = "dist/windows-$arch/$variant"
              $names = @(
                "greencurve-$version-windows-$arch.7z",
                "greencurve-$version-windows-$arch.7z.sha256",
                "greencurve-$version-windows-$arch-setup.exe",
                "greencurve-$version-windows-$arch-setup.exe.sha256"
              )
              foreach ($name in $names) {
                $path = Join-Path $base $name
                if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) {
                  throw "missing or empty Windows variant artifact: $path"
                }
              }
            }
          }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Cache toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            zig
            llvm-mingw-linux
            seven-zip
          key: toolchain-linux-${{ hashFiles('build.py', 'compilers/*/manifest.json') }}
          restore-keys: toolchain-linux-
      # No p7zip here on purpose: the Linux release is a .tar.xz written by the
      # standard library, because 7-Zip cannot record Unix file modes when the
      # archive is produced on a Windows host.  Leaving 7-Zip off this runner
      # keeps that independence honest -- a reintroduced dependency fails the
      # packaging step instead of passing unnoticed.  (The pinned 7-Zip that the
      # release job uses for the Windows .7z is vendored, never apt-installed.)
      #
      # clang-tidy and the host clang++ are the two tools CI still takes from the
      # runner image.  Neither can touch a release artifact: they only run in
      # this job, which publishes nothing.  Pinning them would mean vendoring a
      # full ~2 GB LLVM for Linux, since llvm-mingw ships no Linux ASan runtime.
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy-18
          # build.py intentionally resolves one stable analyzer name. Pin it to the
          # same major version as the documented ratchet instead of whatever the
          # runner image happens to ship this month.
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
      - name: Verify the pinned toolchain
        run: python build.py --verify-toolchain
      - name: Build Linux target
        run: python build.py --check --target linux
      # tests/linux_transport_regression.cpp needs real Linux filesystem
      # sockets, so this job is the only place it can execute. It previously
      # never ran in CI at all.
      - name: Test
        run: python build.py --test
      - name: Test with AddressSanitizer
        run: python build.py --test --asan
      - name: Static analysis ratchet
        run: python build.py --tidy
      - name: Fuzz untrusted-input boundaries
        run: python build.py --fuzz --fuzz-runs 5000
      - name: Build verified Linux release packages
        run: python build.py --target linux
      - name: Confirm the Linux archives were produced and the tree is clean
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          for f in \
            "dist/linux-x64/greencurve-${version}-linux-x64.tar.xz" \
            "dist/linux-x64/greencurve-${version}-linux-x64.tar.xz.sha256" \
            "dist/linux-x64/greencurve-${version}-1-arch-x86_64.pkg.tar.zst" \
            "dist/linux-x64/greencurve-${version}-1-arch-x86_64.pkg.tar.zst.sha256" \
            "dist/linux-x64/greencurve-${version}-1-debian-amd64.deb" \
            "dist/linux-x64/greencurve-${version}-1-debian-amd64.deb.sha256" \
            "dist/linux-x64/greencurve-${version}-1-fedora-x86_64.rpm" \
            "dist/linux-x64/greencurve-${version}-1-fedora-x86_64.rpm.sha256" \
            "dist/linux-x64/greencurve-${version}-1-suse-x86_64.rpm" \
            "dist/linux-x64/greencurve-${version}-1-suse-x86_64.rpm.sha256"; do
            test -s "$f" || { echo "::error::missing Linux release artifact: $f"; exit 1; }
          done
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::packaging modified the tracked checkout"
            printf '%s\n' "$dirty"
            exit 1
          fi
      # Real installs with each distro's own front end (apt, dnf, zypper,
      # pacman) in digest-pinned containers: install, upgrade, remove.  CI has
      # no signing key, so these rpms are unsigned; the release job repeats this
      # with signed rpms and refuses signature overrides.
      - name: Install the x64 packages on native distros
        run: >-
          python tools/linux_package_container_check.py --engine docker
          --packages dist/linux-x64 --binary dist/linux-x64/greencurve/greencurve
      # The pinned toolchains are x86_64-only, so arm64 packages are built here
      # and installed natively by the linux-packages-arm64 job below.
      - name: Hand the arm64 packages to the arm64 install job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-arm64-packages
          path: |
            dist/linux-arm64/greencurve-*-1-*
            dist/linux-arm64/greencurve/greencurve
          if-no-files-found: error
          retention-days: 1

  linux-packages-arm64:
    needs: linux
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Receive the arm64 packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: linux-arm64-packages
          path: dist/linux-arm64
      - name: Install the arm64 packages on native distros
        run: >-
          python tools/linux_package_container_check.py --engine docker --arch arm64
          --packages dist/linux-arm64 --binary dist/linux-arm64/greencurve/greencurve

  # The release workflow builds the Windows artifacts on a Linux runner, and
  # that combination -- cross-compiled PEs packaged by the pinned Linux 7-Zip --
  # otherwise runs for the first time during an actual release, where a failure
  # costs a tag and a public release. This job runs it in advance and publishes
  # nothing.
  #
  # It is a separate job on purpose: the linux job above must keep running with
  # no 7-Zip present at all, or its proof that the Linux .tar.xz needs no
  # external archiver stops proving anything.
  release-packaging:
    runs-on: ubuntu-24.04
    env:
      GREENCURVE_TOOLCHAIN_LOCAL_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.10'
      - name: Fetch the pinned toolchain from our own Compilers release
        run: python build.py --fetch-toolchain
      - name: Verify the pinned toolchain
        run: python build.py --verify-toolchain
      - name: Build Windows release packages on Linux
        run: python build.py --target windows
      - name: Confirm the archives were produced and the tree is clean
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          for f in \
            "dist/windows-x64/greencurve-${version}-windows-x64.7z" \
            "dist/windows-arm64/greencurve-${version}-windows-arm64.7z" \
            "dist/windows-x64/greencurve-${version}-windows-x64-setup.exe" \
            "dist/windows-arm64/greencurve-${version}-windows-arm64-setup.exe"; do
            test -s "$f" || { echo "::error::missing release artifact: $f"; exit 1; }
          done
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::packaging modified the tracked checkout"
            printf '%s\n' "$dirty"
            exit 1
          fi
