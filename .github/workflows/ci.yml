name: CI

# Manual-only: run the full Windows/Linux CI gates on demand. There is no
# automatic trigger, so a push alone never starts these jobs.
#
# Actions are pinned to commit SHAs rather than tags, and the compilers come
# from this repository's own Compilers release with SHA-256 pins in
# compilers/*/manifest.json.  Unlike the release workflow, CI does keep a
# toolchain cache: it publishes nothing, and every restored tree is re-verified
# against the manifest before it is used.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.14'
      # The toolchains are ~190 MB of llvm-mingw plus Zig, redownloaded on every
      # job otherwise. build.py verifies them against digests pinned in the
      # script and in compilers/*/manifest.json (not the adjacent .sha256
      # markers), so a restored cache is still integrity-checked before use --
      # every binary in bin/, not just the driver.
      - name: Cache toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            llvm-mingw
            zig
            seven-zip
          key: toolchain-windows-${{ hashFiles('build.py', 'compilers/*/manifest.json') }}
          restore-keys: toolchain-windows-
      - name: Verify the pinned toolchain
        run: python build.py --verify-toolchain
      - name: Build and test
        run: |
          python build.py --test
          python build.py --check --target all
      - name: Build with sanitizers
        run: python build.py --test --sanitizer
      - name: Build with AddressSanitizer
        run: python build.py --test --asan
      - name: Static analysis ratchet
        run: python build.py --tidy
      - name: Fuzz untrusted-input boundaries
        run: python build.py --fuzz --fuzz-runs 5000
      - name: Build verified Windows release packages
        run: python build.py --target windows

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Cache toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            zig
            llvm-mingw-linux
            seven-zip
          key: toolchain-linux-${{ hashFiles('build.py', 'compilers/*/manifest.json') }}
          restore-keys: toolchain-linux-
      # No p7zip here on purpose: the Linux release is a .tar.xz written by the
      # standard library, because 7-Zip cannot record Unix file modes when the
      # archive is produced on a Windows host.  Leaving 7-Zip off this runner
      # keeps that independence honest -- a reintroduced dependency fails the
      # packaging step instead of passing unnoticed.  (The pinned 7-Zip that the
      # release job uses for the Windows .7z is vendored, never apt-installed.)
      #
      # clang-tidy and the host clang++ are the two tools CI still takes from the
      # runner image.  Neither can touch a release artifact: they only run in
      # this job, which publishes nothing.  Pinning them would mean vendoring a
      # full ~2 GB LLVM for Linux, since llvm-mingw ships no Linux ASan runtime.
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy
      - name: Verify the pinned toolchain
        run: python build.py --verify-toolchain
      - name: Build Linux target
        run: python build.py --check --target linux
      # tests/linux_transport_regression.cpp needs real Linux filesystem
      # sockets, so this job is the only place it can execute. It previously
      # never ran in CI at all.
      - name: Test
        run: python build.py --test
      - name: Test with AddressSanitizer
        run: python build.py --test --asan
      - name: Static analysis ratchet
        run: python build.py --tidy
      - name: Fuzz untrusted-input boundaries
        run: python build.py --fuzz --fuzz-runs 5000
      - name: Build verified Linux release packages
        run: python build.py --target linux

  # The release workflow builds the Windows artifacts on a Linux runner, and
  # that combination -- cross-compiled PEs packaged by the pinned Linux 7-Zip --
  # otherwise runs for the first time during an actual release, where a failure
  # costs a tag and a public release. This job runs it in advance and publishes
  # nothing.
  #
  # It is a separate job on purpose: the linux job above must keep running with
  # no 7-Zip present at all, or its proof that the Linux .tar.xz needs no
  # external archiver stops proving anything.
  release-packaging:
    runs-on: ubuntu-latest
    env:
      GREENCURVE_TOOLCHAIN_LOCAL_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12.14'
      - name: Fetch the pinned toolchain from our own Compilers release
        run: python build.py --fetch-toolchain
      - name: Verify the pinned toolchain
        run: python build.py --verify-toolchain
      - name: Build Windows release packages on Linux
        run: python build.py --target windows
      - name: Confirm the archives were produced and the tree is clean
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          for f in \
            "greencurve-${version}-windows-x64.7z" \
            "greencurve-${version}-windows-arm64.7z" \
            "greencurve-${version}-windows-x64-setup.exe" \
            "greencurve-${version}-windows-arm64-setup.exe"; do
            test -s "$f" || { echo "::error::missing release artifact: $f"; exit 1; }
          done
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::packaging modified the tracked checkout"
            printf '%s\n' "$dirty"
            exit 1
          fi
